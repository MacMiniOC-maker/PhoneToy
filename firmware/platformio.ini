; Lets the same ESP-IDF project build from the PlatformIO extension in VS Code.
; (`idf.py build` works too; both read sdkconfig.defaults.)
[platformio]
src_dir = main

[env:phonetoy]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 16MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
